# Host Nginx: proxy administrator.winmap.vn -> Winmap Admin Docker (127.0.0.1:8088)
# Cài đặt:
#   sudo cp deploy/nginx-administrator.winmap.vn.conf /etc/nginx/sites-available/administrator.winmap.vn
#   sudo ln -sf /etc/nginx/sites-available/administrator.winmap.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL lần đầu:
#   sudo certbot --nginx -d administrator.winmap.vn

server {
    listen 80;
    listen [::]:80;
    server_name administrator.winmap.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
