# Document root: thư mục public/ của Laravel.
# Đặt vào /etc/nginx/sites-available/ rồi bật symlink tới sites-enabled.
# Chỉnh fastcgi_pass cho đúng phiên bản PHP-FPM (ví dụ php8.3-fpm.sock).

server {
    listen 80;
    listen [::]:80;
    server_name administrator.winmap.vn;

    root /var/www/winmap_admin/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# HTTPS: bật certbot hoặc trỏ certificate, rồi thêm server 443 ssl tương tự và redirect 80 -> 443.
